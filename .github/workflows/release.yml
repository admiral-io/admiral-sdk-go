name: Release

# Triggered by sync commits pushed from admiral-protos' tag-triggered cascade.
# semantic-release cuts a release tag (vX.Y.Z) from conventional commits.
#
# There is one channel on purpose. A rolling-RC channel existed and was removed
# (2026-08-30): it derived its version from conventional commits while the
# release channel derived its own from the shape of the admiral-protos tag, so
# the two disagreed about the SAME content -- the API-key rename shipped as
# 1.6.5 on latest while the rc channel called it 2.0.0-rc.1. One honest version
# beats two that contradict each other.

on:
  push:
    branches:
      - master
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    # This repo is regenerated and pushed immediately after its schema lands on
    # the BSR, so it races proxy.golang.org's indexing of the stubs it imports.
    # Buf's proxy has them already; it 404s everything else and falls through.
    env:
      GOPROXY: https://buf.build/gen/go,https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test -v ./...

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          # semantic-release needs all tags locally to find the last release.
          fetch-tags: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Major pinned: minors/patches still float at run time, but a breaking
        # semantic-release major waits for a deliberate template edit.
        run: npx --yes semantic-release@25
